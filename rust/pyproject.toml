[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "grib-idx"
version = "0.1.0"
description = "Evaluation spike: idx-driven GRIB2 range reads from object storage, decoded to Arrow"
requires-python = ">=3.10"
dependencies = ["pyarrow>=14"]

[dependency-groups]
dev = ["maturin>=1.9,<2", "numpy", "pytest"]

[tool.maturin]
features = ["python"]
module-name = "grib_idx"
